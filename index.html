<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spool.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap"
      rel="stylesheet"
    />
    <title>spool</title>
    <script>
      (function () {
        try {
          const t = localStorage.getItem("spool_theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
          }
          // "system" (the default) or nothing stored: leave the attribute
          // unset, same as applyTheme() does, so the prefers-color-scheme
          // rule below decides — matching dark-OS assumed otherwise would
          // flash dark at every light-OS user on default settings.
        } catch (e) {
          // No-op: the unstyled fallback is the light background below.
        }
      })();
    </script>
    <style>
      :root {
        --loader-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --loader-bg: #09090b;
        }
      }
      :root[data-theme="dark"] {
        --loader-bg: #09090b;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--loader-bg);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--loader-bg);
        z-index: 99999;
      }
      .preloader-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: preloader-fade-in 0.2s ease-out forwards;
      }
      .preloader-icon-wrap {
        position: relative;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: linear-gradient(135deg, #5e6ad2, #8b5cf6);
        box-shadow: 0 8px 24px -4px rgba(94, 106, 210, 0.35);
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      .preloader-svg {
        width: 22px;
        height: 22px;
      }
      .preloader-name {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.025em;
        background: linear-gradient(to right, #5e6ad2, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes preloader-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes preloader-fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-box">
          <div class="preloader-icon-wrap">
            <svg class="preloader-svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4.2">
              <circle cx="12" cy="12" r="9.5" stroke-dasharray="12.435 2.487" transform="rotate(-90 12 12)" />
            </svg>
          </div>
          <span class="preloader-name">spool</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
