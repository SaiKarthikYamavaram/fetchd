<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>spool options</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { min-height: 100vh; font-size: 14px; }
      .page { max-width: 560px; margin: 0 auto; padding: 44px 22px 60px; }

      .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .logo {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: var(--radius-md);
        box-shadow: 0 4px 14px rgba(94, 106, 210, 0.45), var(--inner-hl);
      }
      h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.025em; margin: 0; }
      .sub { color: var(--muted); margin: 0 0 26px 46px; font-size: 13px; }

      .card {
        padding: 20px 22px;
        margin-bottom: 14px;
        background: var(--surface-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }
      h2 {
        margin: 0 0 14px;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--faint);
      }

      /* Each setting is its own line with a hairline between, so a long list
         stays scannable without boxing every row. */
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child { border-bottom: none; padding-bottom: 0; }
      .row:first-of-type { padding-top: 0; }
      .row label { font-size: 13.5px; }

      input[type="number"] { width: 108px; text-align: right; }
      textarea { width: 100%; min-height: 76px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }

      .types { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
      .types label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }

      .hint { font-size: 12px; line-height: 1.55; color: var(--faint); margin: 10px 0 0; }

      .saved {
        height: 18px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ok);
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <div class="page">
      <div class="head">
        <span class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.2">
            <circle cx="12" cy="12" r="9.5" stroke-dasharray="12.435 2.487" transform="rotate(-90 12 12)" />
          </svg>
        </span>
        <h1>spool integration</h1>
      </div>
      <p class="sub">How the browser hands downloads to the spool app.</p>

      <div class="card">
        <h2>General</h2>
        <div class="row"><label for="enabled">Extension enabled</label><input type="checkbox" id="enabled" /></div>
        <div class="row"><label for="grabMedia">Detect media on pages</label><input type="checkbox" id="grabMedia" /></div>
        <div class="row"><label for="intercept">Capture the browser&rsquo;s own downloads</label><input type="checkbox" id="intercept" /></div>
        <div class="row"><label for="askBeforeDownload">Ask for folder &amp; options in the app</label><input type="checkbox" id="askBeforeDownload" /></div>
        <div class="row"><label for="showPanel">Show download button on video pages</label><input type="checkbox" id="showPanel" /></div>
        <div class="row"><label for="minSizeKb">Ignore files smaller than (KB)</label><input type="number" id="minSizeKb" min="0" step="128" /></div>
      </div>

      <div class="card">
        <h2>File types to handle</h2>
        <div class="types">
          <label><input type="checkbox" data-type="video" /> Video</label>
          <label><input type="checkbox" data-type="audio" /> Audio</label>
          <label><input type="checkbox" data-type="archive" /> Archives</label>
          <label><input type="checkbox" data-type="document" /> Documents</label>
          <label><input type="checkbox" data-type="image" /> Images</label>
          <label><input type="checkbox" data-type="other" /> Other binaries</label>
        </div>
      </div>

      <div class="card">
        <h2>Excluded domains</h2>
        <textarea id="excludeDomains" placeholder="one host per line, e.g. mail.google.com"></textarea>
        <p class="hint">Requests to these hosts are never detected or captured.</p>
      </div>

      <div class="saved" id="saved"></div>
    </div>

    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
