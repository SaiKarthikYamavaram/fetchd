<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px; margin: 0; padding: 0;
        font: 13px system-ui, sans-serif;
        color: #1a1a1a; background: #fff;
      }
      @media (prefers-color-scheme: dark) { body { color: #e8eaf0; background: #15181f; } }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 11px 14px; border-bottom: 1px solid rgba(128,128,128,0.2);
      }
      .title { font-size: 14px; font-weight: 650; }
      .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #9aa0ad; }
      .dot.up { background: #10b981; } .dot.down { background: #ef4444; }
      .section { padding: 10px 14px; }
      .muted { color: #8b909c; font-size: 12px; }
      .item {
        display: flex; align-items: center; gap: 9px;
        padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,0.12);
      }
      .item:last-child { border-bottom: none; }
      .tag {
        flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center;
        border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase;
        color: #6366f1; background: rgba(99,102,241,0.14);
      }
      .popthumb {
        flex-shrink: 0; width: 56px; height: 34px; object-fit: cover;
        border-radius: 6px; background: rgba(128,128,128,0.2);
      }
      .meta { flex: 1; min-width: 0; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
      .sub { font-size: 11px; color: #8b909c; }
      button {
        font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid rgba(128,128,128,0.25);
        background: transparent; color: inherit; padding: 5px 10px;
      }
      button.primary { color: #fff; background: linear-gradient(135deg,#6366f1,#8b5cf6); border: none; }
      button.dl { padding: 5px 9px; font-size: 12px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .bar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(128,128,128,0.2); }
      .bar .grow { flex: 1; }
      footer {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 14px; border-top: 1px solid rgba(128,128,128,0.2); font-size: 12px;
      }
      label.toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
      a { color: #6366f1; text-decoration: none; cursor: pointer; }
      .foot-col { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
      .foot-row { display: flex; align-items: center; justify-content: space-between; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">fetchd</span>
      <span class="status"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></span>
    </header>

    <div class="section" id="videoSection" hidden>
      <div class="item">
        <img id="videoThumb" class="popthumb" alt="" hidden />
        <span class="tag" id="videoTag" style="color:#ef4444;background:rgba(239,68,68,0.14)">VID</span>
        <div class="meta">
          <div class="name" id="videoName">This page's video</div>
          <div class="sub">download with yt-dlp (quality set in the app)</div>
        </div>
        <button class="dl primary" id="downloadVideo">Download</button>
      </div>
    </div>

    <div class="section">
      <div id="empty" class="muted" hidden>No downloadable media detected on this page.</div>
      <div id="list"></div>
    </div>

    <div class="bar" id="allBar" hidden>
      <button class="primary grow" id="downloadAll">Download all</button>
      <button id="clear">Clear</button>
    </div>

    <footer class="foot-col">
      <label class="toggle">
        <input type="checkbox" id="ask" />
        <span>Ask for folder &amp; options</span>
      </label>
      <div class="foot-row">
        <label class="toggle">
          <input type="checkbox" id="intercept" />
          <span>Capture browser downloads</span>
        </label>
        <a id="options">Options</a>
      </div>
    </footer>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
