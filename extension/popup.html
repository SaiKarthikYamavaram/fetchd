<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { width: 340px; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .logo {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 9px;
        box-shadow: 0 4px 12px rgba(94, 106, 210, 0.45), var(--inner-hl);
      }
      .title { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 3px 9px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
      .dot.up { background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 60%, transparent); }
      .dot.down { background: var(--err); box-shadow: 0 0 8px color-mix(in srgb, var(--err) 60%, transparent); }

      .section { padding: 12px 14px; }
      .muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; }

      /* Each detection is a card, the same glass surface the app's rows use. */
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 11px;
        margin-bottom: 8px;
        background: var(--surface-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: border-color 0.25s var(--ease), transform 0.25s var(--ease);
      }
      .item:last-child { margin-bottom: 0; }
      .item:hover { border-color: var(--border-strong); transform: translateY(-1px); }

      .tag {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-text);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
        border-radius: 10px;
        box-shadow: var(--inner-hl);
      }
      /* Type is carried by hue as well as the three-letter label, matching the
         app's row tiles. The accent tint above is the fallback. */
      .tag[data-type="video"] { color: #f87171; background: rgba(248, 113, 113, 0.13); border-color: rgba(248, 113, 113, 0.26); }
      .tag[data-type="audio"] { color: #a78bfa; background: rgba(167, 139, 250, 0.13); border-color: rgba(167, 139, 250, 0.26); }
      .tag[data-type="archive"] { color: #f59e0b; background: rgba(245, 158, 11, 0.13); border-color: rgba(245, 158, 11, 0.26); }
      .tag[data-type="document"] { color: #60a5fa; background: rgba(96, 165, 250, 0.13); border-color: rgba(96, 165, 250, 0.26); }
      .tag[data-type="image"] { color: #34d399; background: rgba(52, 211, 153, 0.13); border-color: rgba(52, 211, 153, 0.26); }

      .popthumb {
        flex-shrink: 0;
        width: 56px;
        height: 34px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
      }

      .meta { flex: 1; min-width: 0; }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12.5px;
        font-weight: 560;
        letter-spacing: -0.005em;
      }
      .sub {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--muted);
      }

      button.dl { flex-shrink: 0; padding: 6px 11px; font-size: 12px; }

      .bar {
        display: flex;
        gap: 8px;
        padding: 11px 14px;
        border-top: 1px solid var(--border);
      }
      .bar .grow { flex: 1; }

      footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        font-size: 12.5px;
      }
      .foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header>
      <span class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.2">
            <circle cx="12" cy="12" r="9.5" stroke-dasharray="12.435 2.487" transform="rotate(-90 12 12)" />
          </svg>
        </span>
        <span class="title">spool</span>
      </span>
      <span class="status"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></span>
    </header>

    <div class="section" id="videoSection" hidden>
      <div class="item">
        <img id="videoThumb" class="popthumb" alt="" hidden />
        <span class="tag" id="videoTag" data-type="video">VID</span>
        <div class="meta">
          <div class="name" id="videoName">This page's video</div>
          <div class="sub">yt-dlp &middot; quality set in the app</div>
        </div>
        <button class="dl primary" id="downloadVideo">Download</button>
      </div>
    </div>

    <div class="section">
      <div id="empty" class="muted" hidden>No downloadable media detected on this page.</div>
      <div id="list"></div>
    </div>

    <div class="bar" id="allBar" hidden>
      <button class="primary grow" id="downloadAll">Download all</button>
      <button id="clear">Clear</button>
    </div>

    <footer>
      <label class="toggle">
        <input type="checkbox" id="ask" />
        <span>Ask for folder &amp; options</span>
      </label>
      <div class="foot-row">
        <label class="toggle">
          <input type="checkbox" id="intercept" />
          <span>Capture browser downloads</span>
        </label>
        <a id="options">Options</a>
      </div>
    </footer>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
